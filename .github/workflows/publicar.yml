# Monta o site com o Eleventy e publica no branch gh-pages a cada envio para o main.
# Adicionar, tirar ou mudar um carro (src/veiculos/*.md e imagens-geradas/) já atualiza vitrine, filtros e marcas.
# O GitHub Pages do repositório continua em "Deploy from a branch: gh-pages"; nada a mudar nas configurações.
name: Publicar site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Montar o site
        run: npx @11ty/eleventy --pathprefix="/${{ github.event.repository.name }}/"
      - name: Buscar o branch publicado
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: publicado
      - name: Publicar no gh-pages (mantém o histórico)
        run: |
          rsync -a --delete --exclude .git _site/ publicado/
          touch publicado/.nojekyll
          cd publicado
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nada mudou no site."; exit 0; fi
          git commit -q -m "Publicação automática de ${GITHUB_SHA::7}"
          git push origin gh-pages
